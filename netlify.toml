[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"

# Redirect all traffic to HTTPS
[[redirects]]
  from = "http://remoteroles.online/*"
  to = "https://remoteroles.online/:splat"
  status = 301
  force = true

# SPA fallback — Netlify plugin handles Next.js routing,
# but this catches any edge cases
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/___netlify-handler"
  status = 200
